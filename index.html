<div id="app">
  <header>
    <div class="brand">Pippa’s Keep<small>Year 10 English</small></div>

      <div class="stat" title="Coins"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#e3a61f" stroke="#1c2333" stroke-width="1.8"/><circle cx="10" cy="10" r="4.5" fill="none" stroke="#1c2333" stroke-width="1.4"/></svg><span id="coins" aria-label="coins">0</span></div>

    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav aria-label="Sections">
    <button data-act="go:castle">Castle</button>
